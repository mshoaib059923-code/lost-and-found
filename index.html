<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Lost & Found Identifier</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f7f6; max-width: 500px; margin: auto; }
        h2 { color: #2c3e50; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #219150; }
        .result-box { background: #eef9f1; border-left: 5px solid #27ae60; padding: 10px; font-weight: bold; white-space: pre-wrap; }
        img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 5px; margin-top: 10px; display: none; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>

    <h2>🎒 School Lost & Found AI</h2>

    <!-- API Key Section (Saved Permanently) -->
    <div class="card">
        <label><b>Gemini API Key:</b></label>
        <input type="password" id="apiKey" placeholder="Apni Gemini API Key daalein">
        <button onclick="saveApiKey()" style="background: #e67e22;">🔑 Save Key Permanently</button>
        <small id="keyStatus" style="color: #27ae60; font-weight: bold; display: block; margin-top: 5px;"></small>
    </div>

    <!-- Register Item Section -->
    <div class="card">
        <h3>1. Bache & Samaan Ka Detail Save Karein</h3>
        <input type="text" id="kidName" placeholder="Bache ka Naam (e.g. Tashvaib)">
        <input type="text" id="itemDesc" placeholder="Samaan ke baare me (e.g. Red Milton Bottle)">
        <button onclick="registerItem()">Save Item</button>
        <h4>Saved Items List:</h4>
        <ul id="itemList"></ul>
    </div>

    <!-- Identify Item Section -->
    <div class="card">
        <h3>2. Photo Leke Pehchano</h3>
        <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)">
        <img id="preview" alt="Preview Image">
        <button onclick="identifyItem()" style="background: #2980b9; margin-top: 10px;">🔍 AI Se Check Karein</button>
        <div id="status" style="margin-top: 10px; color: #7f8c8d;"></div>
    </div>

    <!-- Result Display -->
    <div class="card" id="resultCard" style="display:none;">
        <h3>AI Ka Jawab:</h3>
        <div class="result-box" id="resultText"></div>
    </div>

<script>
    let db = JSON.parse(localStorage.getItem('studentDb')) || [];

    // Load Saved API Key & Database on Startup
    window.onload = function() {
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyStatus').innerText = '✔ API Key Saved & Ready!';
        }
        updateList();
    };

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('geminiApiKey', key);
            document.getElementById('keyStatus').innerText = '✔ API Key Saved Permanently!';
            alert('API Key Save Ho Gayi!');
        } else {
            alert('Kripya API Key Bharein!');
        }
    }

    function updateList() {
        const list = document.getElementById('itemList');
        list.innerHTML = '';
        db.forEach((item, index) => {
            list.innerHTML += `<li><b>${item.name}</b>: ${item.desc} <button style="width:auto; padding:2px 6px; background:#e74c3c;" onclick="deleteItem(${index})">X</button></li>`;
        });
        localStorage.setItem('studentDb', JSON.stringify(db));
    }

    function registerItem() {
        const name = document.getElementById('kidName').value.trim();
        const desc = document.getElementById('itemDesc').value.trim();
        if(name && desc) {
            db.push({ name, desc });
            updateList();
            document.getElementById('kidName').value = '';
            document.getElementById('itemDesc').value = '';
            alert('Item Save Ho Gaya!');
        } else {
            alert('Dono fields bharein!');
        }
    }

    function deleteItem(index) {
        db.splice(index, 1);
        updateList();
    }

    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('preview');
            output.src = reader.result;
            output.style.display = 'block';
        };
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    async function identifyItem() {
        const apiKey = localStorage.getItem('geminiApiKey') || document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('imageInput');
        const status = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');

        if (!apiKey) {
            alert('Pehle API Key Save Karein!');
            return;
        }
        if (fileInput.files.length === 0) {
            alert('Pehle Photo Click Karein!');
            return;
        }

        status.innerText = 'AI Check Kar Raha Hai...';
        resultCard.style.display = 'none';

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onloadend = async function () {
            const base64Image = reader.result.split(',')[1];
            const contextList = db.map(i => `- ${i.name}: ${i.desc}`).join('\n');
            const promptText = `Analyze this image of a school item.
Registered students & items:
${contextList || "No registered list provided."}

Task:
1. Describe the item in the photo.
2. State clearly whose item this is based on registered list.
3. Keep response in simple Hindi/Hinglish.`;

            const payload = {
                contents: [{
                    parts: [
                        { text: promptText },
                        { inline_data: { mime_type: file.type, data: base64Image } }
                    ]
                }]
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                status.innerText = '';

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultText.innerText = data.candidates[0].content.parts[0].text;
                    resultCard.style.display = 'block';
                } else {
                    resultText.innerText = 'Pehchanne me samasya hui. Dubara try karein.';
                    resultCard.style.display = 'block';
                }
            } catch (err) {
                status.innerText = '';
                alert('Error: ' + err.message);
            }
        };

        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
