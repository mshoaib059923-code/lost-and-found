<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Lost & Found AI</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f7f6; max-width: 500px; margin: auto; }
        h2 { color: #2c3e50; text-align: center; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #219150; }
        .result-box { background: #eef9f1; border-left: 5px solid #27ae60; padding: 10px; font-weight: bold; white-space: pre-wrap; }
        img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 5px; margin-top: 10px; display: none; }
        .item-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; }
        .item-img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; margin-right: 10px; display: block; }
    </style>
</head>
<body>

    <h2>🎒 School Lost & Found AI</h2>

    <!-- API Key Section -->
    <div class="card">
        <label><b>Gemini API Key:</b></label>
        <input type="password" id="apiKey" placeholder="Apni Gemini API Key daalein">
        <button onclick="saveApiKey()" style="background: #e67e22;">🔑 Save Key Permanently</button>
        <small id="keyStatus" style="color: #27ae60; font-weight: bold; display: block; margin-top: 5px;"></small>
    </div>

    <!-- Register Item Section -->
    <div class="card">
        <h3>1. Bache Ka Detail & Reference Photo Save Karein</h3>
        <input type="text" id="kidName" placeholder="Bache ka Naam (e.g. Tashvaib)">
        <input type="text" id="itemDesc" placeholder="Samaan (e.g. Red Milton Bottle)">
        <label style="font-size: 13px; font-weight: bold; color: #555;">Reference Photo Lijiye:</label>
        <input type="file" id="regImageInput" accept="image/*" capture="environment" onchange="previewRegImage(event)">
        <img id="regPreview" alt="Reference Image Preview">
        <button onclick="registerItemWithPhoto()">💾 Save Details & Photo</button>
        
        <h4>Saved Database:</h4>
        <div id="itemList"></div>
    </div>

    <!-- Identify Item Section -->
    <div class="card">
        <h3>2. Bhool Jane Par Photo Leke Check Karein</h3>
        <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)">
        <img id="preview" alt="Scan Image Preview">
        <button onclick="identifyItem()" style="background: #2980b9; margin-top: 10px;">🔍 AI Se Match Karein</button>
        <div id="status" style="margin-top: 10px; color: #7f8c8d;"></div>
    </div>

    <!-- Result Display -->
    <div class="card" id="resultCard" style="display:none;">
        <h3>AI Ka Response:</h3>
        <div class="result-box" id="resultText"></div>
    </div>

<script>
    let db = JSON.parse(localStorage.getItem('studentDbWithImages')) || [];
    let currentRegBase64 = "";
    let currentQueryBase64 = "";

    window.onload = function() {
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyStatus').innerText = '✔ API Key Ready!';
        }
        updateList();
    };

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('geminiApiKey', key);
            document.getElementById('keyStatus').innerText = '✔ API Key Saved Permanently!';
            alert('API Key Save Ho Gayi!');
        } else {
            alert('Kripya API Key Bharein!');
        }
    }

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxDim = 600;
                let width = img.width;
                let height = img.height;

                if (width > height && width > maxDim) {
                    height *= maxDim / width;
                    width = maxDim;
                } else if (height > maxDim) {
                    width *= maxDim / height;
                    height = maxDim;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                callback(dataUrl);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function previewRegImage(event) {
        if(event.target.files[0]) {
            compressImage(event.target.files[0], function(compressedDataUrl) {
                const output = document.getElementById('regPreview');
                output.src = compressedDataUrl;
                output.style.display = 'block';
                currentRegBase64 = compressedDataUrl.split(',')[1];
            });
        }
    }

    function registerItemWithPhoto() {
        const name = document.getElementById('kidName').value.trim();
        const desc = document.getElementById('itemDesc').value.trim();
        if(name && desc && currentRegBase64) {
            db.push({ name, desc, image: currentRegBase64 });
            updateList();
            document.getElementById('kidName').value = '';
            document.getElementById('itemDesc').value = '';
            document.getElementById('regPreview').style.display = 'none';
            currentRegBase64 = "";
            alert('Bache ka detail aur photo save ho gaya!');
        } else {
            alert('Teeno bharein: Name, Description aur Reference Photo!');
        }
    }

    function updateList() {
        const list = document.getElementById('itemList');
        list.innerHTML = '';
        db.forEach((item, index) => {
            list.innerHTML += `
                <div class="item-row">
                    <img src="data:image/jpeg;base64,${item.image}" class="item-img">
                    <div style="flex-grow:1;"><b>${item.name}</b><br><small>${item.desc}</small></div>
                    <button style="width:auto; padding:3px 8px; background:#e74c3c;" onclick="deleteItem(${index})">X</button>
                </div>`;
        });
        localStorage.setItem('studentDbWithImages', JSON.stringify(db));
    }

    function deleteItem(index) {
        db.splice(index, 1);
        updateList();
    }

    function previewImage(event) {
        if(event.target.files[0]) {
            compressImage(event.target.files[0], function(compressedDataUrl) {
                const output = document.getElementById('preview');
                output.src = compressedDataUrl;
                output.style.display = 'block';
                currentQueryBase64 = compressedDataUrl.split(',')[1];
            });
        }
    }

    async function identifyItem() {
        const apiKey = localStorage.getItem('geminiApiKey') || document.getElementById('apiKey').value.trim();
        const status = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');

        if (!apiKey) {
            alert('Pehle Gemini API Key daal kar Save Karein!');
            return;
        }
        if (!currentQueryBase64) {
            alert('Pehle Check karne ke liye Photo lijiye!');
            return;
        }
        if (db.length === 0) {
            alert('Pehle kam se kam ek bache ki photo aur detail save karein!');
            return;
        }

        status.innerText = 'AI Photo check kar raha hai... Please wait...';
        resultCard.style.display = 'none';

        let parts = [];
        parts.push({ text: "You are a school lost and found assistant. Compare the LAST image provided (found lost item) against the registered reference images of items." });

        db.forEach((item, index) => {
            parts.push({ text: `Registered Item #${index + 1} -> Student Name: "${item.name}", Info: "${item.desc}"` });
            parts.push({ inline_data: { mime_type: "image/jpeg", data: item.image } });
        });

        parts.push({ text: "Here is the NEW lost item image to identify:" });
        parts.push({ inline_data: { mime_type: "image/jpeg", data: currentQueryBase64 } });

        parts.push({ text: "Task:\n1. Look at the last image.\n2. Compare color, pattern, brand, and design with the reference images above.\n3. Clearly write whose item this is in simple Hindi/Hinglish." });

        const payload = { contents: [{ parts: parts }] };

        // Primary Endpoint: gemini-3.8-flash
        let apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

        try {
            let response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            let data = await response.json();

            // Fallback to gemini-1.5-flash if needed
            if (data.error) {
                const fallbackUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                response = await fetch(fallbackUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                data = await response.json();
            }

            status.innerText = '';

            if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                resultText.innerText = data.candidates[0].content.parts[0].text;
                resultCard.style.display = 'block';
            } else if (data.error) {
                resultText.innerText = "API Error: " + data.error.message;
                resultCard.style.display = 'block';
            } else {
                resultText.innerText = "Response read nahi ho saka. Details: " + JSON.stringify(data);
                resultCard.style.display = 'block';
            }
        } catch (err) {
            status.innerText = '';
            alert("Network Error: " + err.message);
        }
    }
</script>
</body>
</html>
